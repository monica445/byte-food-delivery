services:
  postgres:
    image: postgres:17
    container_name: byte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: byte
      POSTGRES_PASSWORD: byte_dev_password
      POSTGRES_DB: byte_food
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byte -d byte_food"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
